services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: careerpass
      POSTGRES_PASSWORD: careerpass_test_only
      POSTGRES_DB: careerpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpass -d careerpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://careerpass:careerpass_test_only@postgres:5432/careerpass
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: integration-jwt-secret-key-with-at-least-32-characters
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://careerpass:careerpass_test_only@postgres:5432/careerpass
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ROOT: /var/lib/careerpass/objects
      READINESS_TIMEOUT_SECONDS: "2"
      CELERY_TASK_TIME_LIMIT_SECONDS: "30"
      JWT_SECRET_KEY: integration-jwt-secret-key-with-at-least-32-characters
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - integration-objects:/var/lib/careerpass/objects

  worker:
    build: .
    command: ["celery", "-A", "app.infrastructure.tasks.worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://careerpass:careerpass_test_only@postgres:5432/careerpass
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ROOT: /var/lib/careerpass/objects
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CELERY_TASK_TIME_LIMIT_SECONDS: "30"
      JWT_SECRET_KEY: integration-jwt-secret-key-with-at-least-32-characters
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - integration-objects:/var/lib/careerpass/objects

  dispatcher:
    build: .
    command: ["python", "-m", "app.infrastructure.tasks.dispatcher"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://careerpass:careerpass_test_only@postgres:5432/careerpass
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_TIME_LIMIT_SECONDS: "30"
      CELERY_DISPATCHER_POLL_SECONDS: "60"
      JWT_SECRET_KEY: integration-jwt-secret-key-with-at-least-32-characters
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  integration-objects:
