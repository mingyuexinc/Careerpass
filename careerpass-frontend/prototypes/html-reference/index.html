<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careerpass · 求职 Agent 演示</title>
    <style>
      /* 样式与 careerpass-frontend/src/styles/tokens.css + globals.css 保持一致（不含调试重置面板）。 */
      :root {
        --color-bg: #f4f5f7;
        --color-surface: #ffffff;
        --color-line: #eceef2;
        --color-text: #17202b;
        --color-input-text: #5c6877;
        --color-muted: #8c96a3;
        --color-brand: #ff6a00;
        --color-brand-dark: #e85800;
        --color-brand-soft: #fff1e7;
        --color-success: #2dbb78;
        --color-success-soft: #e8f8ef;
        --color-danger: #eb6262;
        --color-danger-soft: #fff0f0;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --shadow: 0 10px 28px rgb(28 37 48 / 6%);
        --shadow-soft: 0 3px 14px rgb(28 37 48 / 5%);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--color-text);
        background: var(--color-bg);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--color-bg);
      }
      button, input, textarea, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      button:disabled, .is-disabled { cursor: not-allowed; opacity: 0.55; }
      a { color: inherit; text-decoration: none; }
      h1, h2, h3, p { margin-top: 0; }
      h1 {
        margin-bottom: 10px;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: -0.045em;
      }
      h2 { margin-bottom: 8px; font-size: 19px; letter-spacing: -0.025em; }
      p { line-height: 1.65; }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .eyebrow {
        color: var(--color-brand);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .page-subtitle, .muted-text { color: var(--color-muted); }
      .inline-button { display: inline-flex; align-items: center; gap: 8px; }

      .auth-layout {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 18% 10%, #fff4e9 0, transparent 36%), var(--color-bg);
      }
      .login-card {
        width: min(500px, 100%);
        padding: 38px;
        background: var(--color-surface);
        border: 1px solid #fff;
        border-radius: 28px;
        box-shadow: var(--shadow);
      }
      .login-brand { margin-bottom: 30px; }
      .brand-lockup { display: flex; align-items: center; gap: 11px; }
      .brand-lockup strong, .brand-lockup span { display: block; }
      .brand-lockup span {
        margin-top: 2px;
        color: var(--color-muted);
        font-size: 11px;
      }
      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: var(--color-brand);
        color: white;
        font-size: 22px;
        font-weight: 900;
        box-shadow: 0 8px 18px rgb(255 106 0 / 22%);
      }
      .role-switcher {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin: 28px 0 20px;
        padding: 4px;
        background: var(--color-bg);
        border-radius: var(--radius-sm);
      }
      .role-switcher button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-muted);
      }
      .role-switcher button.is-active {
        background: white;
        color: var(--color-brand);
        box-shadow: var(--shadow-soft);
        font-weight: 800;
      }
      .login-form { display: grid; gap: 15px; }
      .login-form label, .form-grid label, .status-editor label {
        display: grid;
        gap: 8px;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 750;
      }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: white;
        color: var(--color-input-text);
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
        outline: 0;
      }
      input, select { min-height: 44px; padding: 0 12px; }
      .login-form input::placeholder {
        color: var(--color-muted);
        font-weight: 400;
        opacity: 1;
      }
      textarea { padding: 12px; resize: vertical; }
      input:focus, textarea:focus, select:focus {
        border-color: var(--color-brand);
        box-shadow: 0 0 0 3px var(--color-brand-soft);
      }
      .login-form .form-alert {
        margin: 0;
        color: var(--color-danger);
        font-size: 13px;
      }
      .login-register-link {
        display: block;
        margin-top: 22px;
        color: var(--color-brand);
        font-size: 13px;
        text-align: center;
      }

      .button {
        min-height: 42px;
        padding: 0 17px;
        border: 0;
        border-radius: var(--radius-sm);
        font-weight: 800;
        transition: transform 0.16s ease, background 0.16s ease;
      }
      .button:not(:disabled):hover { transform: translateY(-1px); }
      .button-primary {
        background: var(--color-brand);
        color: white;
        box-shadow: 0 8px 18px rgb(255 106 0 / 18%);
      }
      .button-primary:not(:disabled):hover { background: var(--color-brand-dark); }
      .button-secondary {
        border: 1px solid var(--color-line);
        background: white;
        color: var(--color-text);
      }
      .button-ghost {
        min-height: 34px;
        padding: 0 10px;
        background: transparent;
        color: var(--color-brand);
      }
      .button-danger {
        background: var(--color-danger-soft);
        color: var(--color-danger);
      }

      .app-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        gap: 28px;
        padding: 25px 16px 18px;
        background: white;
        border-right: 1px solid var(--color-line);
      }
      .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: fit-content;
        margin: 0 10px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--color-brand-soft);
        color: var(--color-brand-dark);
        font-size: 12px;
        font-weight: 800;
      }
      .role-badge .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--color-brand);
      }
      .sidebar-nav { display: grid; gap: 6px; }
      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: var(--radius-sm);
        color: var(--color-muted);
        font-size: 14px;
        font-weight: 700;
      }
      .sidebar-nav a:hover { background: var(--color-bg); color: var(--color-text); }
      .sidebar-nav a.active { background: var(--color-brand-soft); color: var(--color-brand); }
      .nav-icon {
        display: grid;
        width: 23px;
        height: 23px;
        place-items: center;
        border-radius: 7px;
        background: #f4f5f7;
        font-size: 14px;
      }
      .sidebar-nav a.active .nav-icon { background: white; }
      .sidebar-footer {
        display: grid;
        gap: 13px;
        margin-top: auto;
        color: var(--color-muted);
        font-size: 12px;
      }
      .profile-mini {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 10px;
        border-top: 1px solid var(--color-line);
      }
      .avatar {
        display: grid;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffd4b7, #ffe9d7);
        color: var(--color-brand-dark);
        font-weight: 800;
      }
      .profile-mini strong { display: block; color: var(--color-text); font-size: 13px; }
      .profile-mini span { display: block; margin-top: 0; color: var(--color-muted); font-size: 12px; }
      .sidebar-footer button {
        min-height: 36px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: white;
        color: var(--color-text);
      }
      .content-area { min-width: 0; padding: 42px clamp(20px, 4vw, 62px); }
      .page-container, .page-view { width: min(1160px, 100%); margin: 0 auto; }
      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .page-header .page-subtitle { max-width: 720px; margin-bottom: 0; }
      .page-header-action { flex: 0 0 auto; }
      .hero-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 220px;
        margin-bottom: 20px;
        padding: 30px 34px;
        overflow: hidden;
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, #fff7f0, #fff);
        box-shadow: var(--shadow-soft);
      }
      .hero-card h2 { font-size: 25px; }
      .hero-card p { max-width: 650px; color: var(--color-muted); }
      .hero-orb {
        display: grid;
        width: 100px;
        height: 100px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 32px;
        background: var(--color-brand);
        color: #fff;
        font-size: 34px;
        box-shadow: 0 16px 28px rgba(255, 106, 0, 0.22);
      }
      .panel-grid, .upload-grid, .two-col {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .two-col { grid-template-columns: 1.25fr 0.75fr; }
      .job-goal-section-nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 20px;
        padding: 6px;
        border: 1px solid var(--color-line);
        border-radius: 17px;
        background: white;
        box-shadow: var(--shadow-soft);
      }
      .job-goal-section-nav a {
        min-width: 0;
        padding: 13px 16px;
        border-radius: 12px;
        color: var(--color-muted);
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      }
      .job-goal-section-nav a:hover, .job-goal-section-nav a.is-active {
        background: var(--color-brand-soft);
        color: var(--color-brand-dark);
      }
      .job-goal-section-nav a.is-active { box-shadow: inset 0 0 0 1px rgb(255 106 0 / 14%); }
      .job-goal-create-page { display: grid; gap: 20px; }
      .job-goal-create-page > .panel { margin-bottom: 0; }
      .form-action-row { display: flex; justify-content: flex-start; }
      .agent-card-content, .agent-card-action { min-width: 0; }
      .agent-card-action { flex: 0 0 auto; }
      .agent-card-action .button { white-space: nowrap; }
      .agent-start-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 12px;
      }
      .job-goal-list-panel { margin-bottom: 0; }
      .job-goal-table { margin-top: 18px; overflow-x: auto; }
      .job-goal-table-head, .job-goal-record-list {
        display: grid;
        grid-template-columns: minmax(260px, 1.6fr) minmax(160px, 0.8fr) minmax(200px, 1fr);
        min-width: 680px;
      }
      .job-goal-table-head {
        align-items: center;
        gap: 22px;
        padding: 0 14px 8px;
        color: #8a94a1;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }
      .job-goal-record-list { gap: 8px; margin: 0; padding: 0; list-style: none; }
      .job-goal-record {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: inherit;
        align-items: center;
        gap: 22px;
        min-height: 48px;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #fff4e8;
        transition: background 0.16s ease;
      }
      .job-goal-record:nth-child(even) { border-color: #edf0f3; background: #fff; }
      .job-goal-record:hover, .job-goal-record:nth-child(even):hover {
        border-color: rgb(255 106 0 / 28%);
        background: #fffaf5;
      }
      .job-goal-record-title {
        overflow: hidden;
        color: #8a4216;
        font-size: 15px;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .job-goal-record:nth-child(even) .job-goal-record-title { color: #354253; }
      .job-goal-record-offer {
        color: #a55d2b;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
      }
      .job-goal-record:nth-child(even) .job-goal-record-offer { color: #465568; }
      .job-goal-record-created { color: #b8754b; font-size: 12px; white-space: nowrap; }
      .job-goal-record:nth-child(even) .job-goal-record-created { color: #98a1ac; }
      .job-goal-record-count { color: var(--color-muted); font-size: 12px; font-weight: 600; }
      .panel {
        margin-bottom: 20px;
        padding: 24px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-lg);
        background: white;
        box-shadow: var(--shadow-soft);
      }
      .panel-heading, .application-top, .conversation-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .application-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.7fr) auto;
        align-items: start;
      }
      .application-heading { min-width: 0; }
      .application-heading h2 { overflow-wrap: anywhere; }
      .application-match-summary {
        min-width: 0;
        max-width: 360px;
        padding: 12px 14px;
        border: 1px solid rgb(255 106 0 / 18%);
        border-radius: 12px;
        background: #fff8f2;
      }
      .application-match-summary strong {
        display: block;
        color: var(--color-brand-dark);
        font-size: 13px;
      }
      .application-match-summary p {
        margin: 6px 0 0;
        color: var(--color-muted);
        font-size: 12px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .panel-heading p { margin-bottom: 0; }
      .panel-heading-note { color: var(--color-brand); font-size: 12px; font-weight: 800; }
      .condition-list, .notice-list, .quick-links, .file-list { display: grid; gap: 10px; }
      .step-list { display: grid; gap: 12px; }
      .step-list-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 13px;
        border-radius: 14px;
        background: var(--color-bg);
      }
      .step-list-copy { min-width: 0; }
      .step-list-copy strong {
        display: block;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
      }
      .step-list-copy span {
        display: block;
        margin-top: 4px;
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.5;
      }
      .notice-row p {
        display: block;
        margin-top: 4px;
        color: var(--color-muted);
        font-size: 12px;
      }
      .step-marker, .condition-marker {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--color-line);
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        text-align: center;
      }
      .step-marker-active { background: var(--color-brand-soft); color: var(--color-brand); }
      .step-marker-completed { background: var(--color-success-soft); color: var(--color-success); }
      .guide-panel .panel-heading {
        min-height: 28px;
        align-items: center;
        margin-bottom: 18px;
      }
      .guide-panel .panel-heading h2 { margin-bottom: 0; }
      .guide-summary { margin-top: 20px; }
      .status-badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #f3f4f6;
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .status-info { background: #eaf3ff; color: #3177c9; }
      .status-success { background: var(--color-success-soft); color: #15945b; }
      .status-danger { background: var(--color-danger-soft); color: var(--color-danger); }
      .feedback-card, .notice-card {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 20px;
        padding: 20px;
        border-radius: var(--radius-md);
        background: white;
        border: 1px solid var(--color-line);
        box-shadow: var(--shadow-soft);
      }
      .feedback-card p, .notice-card p {
        margin: 4px 0 0;
        color: var(--color-muted);
        font-size: 13px;
      }
      .empty-state { padding: 38px 24px; }
      .error-state { border-color: #ffd9d9; background: #fff9f9; }
      .empty-icon, .notice-icon {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        background: var(--color-brand-soft);
        color: var(--color-brand);
        font-weight: 900;
      }
      .error-state .empty-icon { background: var(--color-danger-soft); color: var(--color-danger); }
      .spinner {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        border: 3px solid var(--color-brand-soft);
        border-top-color: var(--color-brand);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .upload-panel { min-height: 450px; }
      .upload-box {
        display: grid;
        min-height: 280px;
        margin-top: 20px;
        place-items: center;
        align-content: center;
        gap: 8px;
        padding: 22px;
        border: 1.5px dashed #ffb37f;
        border-radius: 20px;
        background: #fffaf6;
        text-align: center;
      }
      .upload-box p {
        max-width: 290px;
        margin: 0 0 9px;
        color: var(--color-muted);
        font-size: 13px;
      }
      .upload-icon {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        margin-bottom: 4px;
        border-radius: 18px;
        background: var(--color-brand-soft);
        color: var(--color-brand);
        font-size: 27px;
      }
      .file-info-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--color-line);
        border-radius: 13px;
        background: var(--color-surface);
        text-align: left;
      }
      .file-info-card.has-delete { padding-right: 48px; }
      .file-type-icon {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 12px;
        background: var(--color-brand-soft);
        color: var(--color-brand);
        font-size: 10px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .file-info-copy { min-width: 0; flex: 1; }
      .file-info-trailing {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        margin-left: auto;
      }
      .file-info-trailing .status-badge { white-space: nowrap; }
      .file-info-name {
        display: block;
        overflow: hidden;
        color: var(--color-text);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-info-meta {
        display: block;
        overflow: hidden;
        margin-top: 4px;
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.5;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-info-delete {
        position: absolute;
        top: 8px;
        right: 8px;
        display: grid;
        width: 25px;
        height: 25px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-muted);
        font-size: 16px;
        line-height: 1;
        opacity: 0;
        cursor: pointer;
        transition: opacity 0.16s ease, background 0.16s ease, color 0.16s ease;
      }
      .file-info-card:hover .file-info-delete, .file-info-delete:focus-visible { opacity: 1; }
      .file-info-delete:hover { background: var(--color-danger-soft); color: var(--color-danger); }
      .file-info-delete:disabled { opacity: 0.45; cursor: not-allowed; }
      .file-list-scroll {
        max-height: 296px;
        margin-top: 16px;
        overflow-y: auto;
        padding-right: 8px;
        scrollbar-color: var(--color-muted) var(--color-bg);
        scrollbar-gutter: stable;
        scrollbar-width: thin;
      }
      .file-list { display: grid; gap: 10px; }
      .file-list .file-info-card { margin-top: 0; }
      .file-list-scroll::-webkit-scrollbar { width: 8px; }
      .file-list-scroll::-webkit-scrollbar-track { border-radius: 8px; background: var(--color-bg); }
      .file-list-scroll::-webkit-scrollbar-thumb {

              <div><h2>启动条件</h2><p class="muted-text">完成必要准备后，启动按钮才会开放。</p></div>
              ${badge(status.tone, status.label)}
            </div>
          </section>
          <section class="agent-card" aria-labelledby="agent-start-title">
            <div class="agent-card-content">
              <h3 id="agent-start-title">${state.agentStatus === "finished" ? "Agent 运行结束" : state.agentStatus === "running" ? "Agent 正在运行" : "启动求职 Agent"}</h3>
              <p>${locked ? "求职目标已锁定，请前往求职进度查看本轮投递结果。" : "启动后，Agent 将完成本轮岗位筛选与系统内投递记录创建。前端不展示中间过程。"}</p>
              <div class="agent-state ${state.agentStatus === "finished" ? "finished" : state.agentStatus === "running" ? "running" : ""}"><span class="pulse"></span>${state.agentStatus === "finished" ? "Agent 运行结束" : state.agentStatus === "running" ? "Agent 运行中" : "尚未启动"}</div>
            </div>
            <div class="agent-card-action">
              <button type="button" class="button button-primary agent-start-button" data-action="start-agent" ${!canStart || state.startingAgent || state.savingGoal ? "disabled" : ""} aria-label="启动求职 Agent">
                ${state.startingAgent ? "启动中…" : state.agentStatus === "finished" ? "运行已结束" : state.agentStatus === "running" ? "已启动" : "启动求职 Agent"}<span aria-hidden="true">→</span>
              </button>
            </div>
          </section>
        </div>`, false);
      }
      function renderJobGoalView() {
        const records = state.jobGoal ? [state.jobGoal] : [];
        const content = records.length
          ? `<div class="job-goal-table">
              <div class="job-goal-table-head"><span>目标岗位</span><span>目标 Offer</span><span>创建时间</span></div>
              <ol class="job-goal-record-list" aria-label="求职目标记录列表">
                ${records.map((goal) => `<li class="job-goal-record"><strong class="job-goal-record-title" title="${esc(goal.title)}">${esc(goal.title)}</strong><span class="job-goal-record-offer">${goal.offerTarget} 个</span><time class="job-goal-record-created" datetime="${esc(goal.createdAt)}">${fmtDateTime(goal.createdAt)}</time></li>`).join("")}
              </ol>
            </div>`
          : `${emptyState("还没有求职目标", "完成求职目标创建后，这里会显示你的目标记录。")}<a class="button button-secondary inline-button" href="#create" data-route="candidate/job-goal/create">去创建求职目标</a>`;
        return renderJobGoalShell(`<section class="panel job-goal-list-panel" aria-labelledby="job-goal-view-title">
          <div class="panel-heading">
            <div><h2 id="job-goal-view-title">已创建的求职目标</h2><p class="muted-text">当前用户已创建的求职目标</p></div>
            <span class="job-goal-record-count">${records.length} 条</span>
          </div>
          ${content}
        </section>`, true);
      }

      function renderProgress() {
        const applications = state.applications;
        const offerCount = getOfferCount(applications.map((item) => item.status));
        const activeCount = applications.filter((item) => !deliveryProgressMeta[item.status].terminal).length;
        const terminatedCount = applications.filter((item) => item.status === "terminated").length;
        const offerTarget = state.jobGoal?.offerTarget ?? 0;
        const offerPercent = offerTarget ? Math.min(offerCount / offerTarget, 1) * 100 : 0;
        const status = agentStatusMeta[state.agentStatus];
        const noMatch = state.agentStatus === "finished" && state.agentRun?.finishReason === "no_match";
        const progressCopy = noMatch
          ? "本轮岗位已筛选完成，暂未产生投递结果。"
          : state.agentStatus === "finished"
            ? "目标已达成，系统已判定 Agent 运行结束。"
            : "继续推进求职沟通，当前状态会在 HR 更新后同步。";
        let emptyBlock = "";
        if (!applications.length) {
          const evaluated = state.matchingSummary.evaluatedJobCount;
          emptyBlock = emptyState(
            state.agentStatus === "not_started" ? "求职进程尚未开始" : "本轮暂未产生匹配结果",
            state.agentStatus === "not_started"
              ? "完成简历解析和求职目标创建后，启动 Agent 即可开始首轮求职。"
              : `本轮已筛选 ${evaluated} 个岗位，暂未产生投递记录。`,
          );
        }
        const roundNumbers = [...new Set(applications.map((item) => item.round))].sort((a, b) => a - b);
        const activeRoundView = roundNumbers.includes(state.selectedRound) ? state.selectedRound : state.round;
        return `<div class="page-view">
          ${pageHeader("CANDIDATE / PROGRESS", "查看求职进度", "这里会持续展示当前投递轮次、岗位阶段和 Offer 目标完成情况。", badge(status.tone, status.label))}
          ${emptyBlock || `
          <section class="offer-progress-panel">
            <div class="offer-ring" style="--offer-progress: ${offerPercent}%" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(offerPercent)}" aria-label="Offer 达成进度">
              <div><strong>${offerCount}/${offerTarget}</strong><span>Offer 达成</span></div>
            </div>
            <div><h2>目标 Offer 达成进度</h2><p>${esc(progressCopy)}</p></div>
          </section>
          <section class="metric-grid">
            <div class="metric"><span>本轮投递</span><strong>${applications.filter((item) => item.round === state.round).length}</strong><small>第 ${state.round} 轮</small></div>
            <div class="metric"><span>累计投递</span><strong>${applications.length}</strong><small>历史总数</small></div>
            <div class="metric"><span>进行中岗位</span><strong>${activeCount}</strong><small>尚未结束</small></div>
            <div class="metric"><span>流程终止</span><strong>${terminatedCount}</strong><small>已结束岗位</small></div>
          </section>
          <div class="round-select ${state.roundSelectOpen ? "is-open" : ""}">
            <button type="button" class="round-select-toggle" data-action="toggle-round-select" aria-haspopup="listbox" aria-expanded="${state.roundSelectOpen}">
              <span>第 ${activeRoundView} 轮 · ${activeRoundView < state.round ? "已结束" : "进行中"}</span><span class="caret" aria-hidden="true">▾</span>
            </button>
            ${state.roundSelectOpen ? `<div class="round-select-menu" role="listbox" aria-label="投递轮次选择">
              ${roundNumbers.map((roundNo) => `<button type="button" role="option" aria-selected="${roundNo === activeRoundView}" class="${roundNo === activeRoundView ? "is-selected" : ""}" data-action="select-round" data-round="${roundNo}">第 ${roundNo} 轮<small>${roundNo < state.round ? "已结束" : "进行中"} · ${applications.filter((item) => item.round === roundNo).length} 条</small></button>`).join("")}
            </div>` : ""}
          </div>
          <section class="application-list">
            <div class="application-list-connected">
              ${applications.filter((item) => item.round === activeRoundView).map((app) => `<article class="application-card">
                <div class="application-top">
                  <div class="application-heading"><h2>${esc(app.jobTitle)}</h2><p>${esc(app.company)} · ${esc(app.location)} · 最近沟通：${app.lastContactAt ? new Date(app.lastContactAt).toLocaleString("zh-CN") : "暂无"}</p></div>
                  <div class="application-match-summary"><strong>综合匹配得分 ${app.matchScore}</strong><p>${esc(app.recommendationReason)}</p></div>
                  ${badge(deliveryProgressMeta[app.status].tone, deliveryProgressMeta[app.status].label)}
                </div>
                ${progressTimeline(app.status)}
              </article>`).join("")}
            </div>
          </section>`}
        </div>`;
      }

      // ---------- 页面：HR ----------
      function renderHrHome() {
        const currentHrJob = state.hrJobs.at(-1) ?? null;
        const hasConversations = state.conversations.length > 0;
        const hasApplications = state.hrApplications().length > 0;
        const processStarted = hasConversations || hasApplications;
        const jobStepStatus = currentHrJob ? "completed" : "active";
        const conversationStepStatus = hasConversations ? "completed" : currentHrJob ? "active" : "waiting";
        const applicationStepStatus = hasApplications ? "completed" : hasConversations ? "active" : "waiting";
        const firstName = state.user.displayName.split(" ")[0];
        const flowSteps = [
          { title: "上传岗位 JD", description: currentHrJob ? "岗位信息已准备，可以查看岗位摘要" : "准备供求职者 Agent 匹配的岗位信息" },
          { title: "参与岗位沟通", description: hasConversations ? "已有沟通记录，可以继续交流" : "求职者 Agent 发起沟通后进行交流" },
          { title: "更新投递进度", description: hasApplications ? "根据实际情况推进指定投递记录" : "沟通开始后可查看并更新" },
        ];
        return `<div class="page-view">
          ${pageHeader("CAREER AGENT", `你好，${firstName}`, "通过 Careerpass，清晰了解岗位沟通与投递进度。")}
          <section class="hero-card"><div>
            <div class="eyebrow">HR WORKSPACE</div>
            <h2>${currentHrJob ? "岗位已经准备就绪" : "先准备一个岗位 JD"}</h2>
            <p>${currentHrJob ? `${currentHrJob.jobTitle ?? "岗位 JD"} · ${currentHrJob.companyName ?? "待解析"}，现在可以查看投递进度。` : "上传岗位资料，为求职者 Agent 准备可匹配的岗位。"}</p>
            <a class="button button-primary inline-button" href="#${currentHrJob ? "hr/applications" : "hr/jobs"}" data-route="${currentHrJob ? "hr/applications" : "hr/jobs"}">${currentHrJob ? "查看投递进度" : "上传岗位 JD"} <span>→</span></a>
          </div><div class="hero-orb">⌁</div></section>
          <section class="two-col">
            <article class="panel guide-panel">
              <div class="panel-heading"><h2>HR 标准流程</h2><span class="panel-heading-note">3 个步骤</span></div>
              <div class="step-list">${flowSteps.map((step, index) => stepListItem(index + 1, [jobStepStatus, conversationStepStatus, applicationStepStatus][index], step.title, step.description)).join("")}</div>
            </article>
            <article class="panel guide-panel">
              <div class="panel-heading"><h2>当前准备状态</h2>${badge(processStarted ? "info" : "neutral", processStarted ? "进行中" : "待完成")}</div>
              <div class="step-list">
                ${stepListItem(1, jobStepStatus, "岗位 JD", currentHrJob ? "已准备岗位数据" : "尚未上传")}
                ${stepListItem(2, conversationStepStatus, "求职者 Agent 沟通", hasConversations ? "已有沟通记录" : "等待求职者启动 Agent")}
                ${stepListItem(3, applicationStepStatus, "投递进度更新", hasApplications ? "可以查看并更新" : "沟通开始后可用")}
              </div>
            </article>
          </section>
          <section class="panel guide-summary">
            <div class="panel-heading"><h2>产品流程说明</h2><span class="panel-heading-note">Careerpass</span></div>
            <p class="page-subtitle">本页面展示 HR 从岗位信息准备、候选人 Agent 沟通到投递进度更新的完整流程。具体岗位和投递数据将在对应功能页面中展示。</p>
            <span class="muted-text">当前已有 ${state.hrApplications().length} 条投递记录。</span>
          </section>
        </div>`;
      }

      function renderJobs() {
        const jobs = state.hrJobs;
        const uploadBadge = state.uploadingJobs
          ? badge("info", "上传中")
          : jobs.length ? badge("success", `${jobs.length} 份已保存`) : badge("neutral", "待上传");
        const jobItems = jobs.map((job) => {
          let parseBadge;
          if (job.parseStatus === "succeeded") parseBadge = badge("success", "已解析");
          else if (job.parseStatus === "queued" || job.parseStatus === "running") parseBadge = badge("info", "解析中");
          else if (job.parseStatus === "failed") parseBadge = badge("danger", "解析失败：暂时不可用或重试耗尽");
          else parseBadge = badge("neutral", "等待解析");
          const deleteDisabled = (job.parseStatus !== "succeeded" && job.parseStatus !== "failed") || job.matchStarted;
          return `<div class="job-upload-item">${fileInfoCard({
            fileName: job.fileName ?? job.jobTitle ?? "岗位 JD",
            uploadedAt: job.createdAt,
            iconLabel: "MD",
            deleteAction: "del-job",
            deleteId: job.id,
            deleteDisabled,
            trailing: parseBadge,
          })}</div>`;
        }).join("");
        return `<div class="page-view">
          ${pageHeader("HR / JOBS", "准备岗位 JD", "上传岗位 JD，建立后续流程可使用的岗位输入资源。")}
          ${state.error ? errorState(state.error) : ""}
          <section class="upload-grid">
            <article class="panel upload-panel">
              <div class="panel-heading">
                <div><h2>岗位 JD 上传</h2><p class="muted-text">选择一份或多份 Markdown（.md）文件后自动上传。</p></div>
                ${uploadBadge}
              </div>
              ${uploadBox({ id: "jobsInput", label: "上传岗位 JD", description: "支持 Markdown（.md），选择后自动上传。", accept: ".md", multiple: true, disabled: state.uploadingJobs, disabledLabel: "正在处理…" })}
              ${jobs.length ? `<div class="file-list-scroll" aria-label="已上传岗位列表" role="region"><div class="file-list" role="list">${jobItems}</div></div>` : ""}
            </article>
          </section>
        </div>`;
      }

      function attachmentCard(message, attachment) {
        const downloading = state.downloadingAttachmentId === attachment.id;
        const downloaded = state.downloadedAttachmentIds.has(attachment.id);
        const isUnavailable = attachment.status === "expired" || attachment.status === "preparing";
        const actionLabel = downloading ? "下载中" : downloaded ? "已下载" : "下载附件";
        const statusText = attachment.status === "expired" ? "已过期" : attachment.status === "preparing" ? "准备中" : downloaded ? "已下载" : "可下载";
        return `<article class="message-attachment-card is-${esc(attachment.status)}" aria-label="附件 ${esc(attachment.fileName)}">
          <div class="message-attachment-main">
            <span class="message-attachment-icon" aria-hidden="true">${esc(getFileType(attachment.fileName))}</span>
            <div class="message-attachment-copy">
              <strong class="message-attachment-name" title="${esc(attachment.fileName)}">${esc(attachment.fileName)}</strong>
              <span class="message-attachment-meta">${esc(attachment.fileType.toUpperCase())} · ${fmtSize(attachment.fileSizeBytes)}</span>
            </div>
            <span class="message-attachment-status">${esc(statusText)}</span>
          </div>
          <div class="message-attachment-details"><span>接收于 ${fmtShortDateTime(attachment.createdAt)}</span><span>有效期至 ${fmtShortDateTime(attachment.expiresAt)}</span></div>
          <div class="message-attachment-actions">
            <button type="button" class="button button-secondary message-attachment-download" aria-label="${actionLabel} ${esc(attachment.fileName)}" ${downloading || isUnavailable ? "disabled" : ""} data-action="download" data-mid="${esc(message.id)}" data-aid="${esc(attachment.id)}">${actionLabel}</button>
          </div>
        </article>`;
      }
      function renderConversations() {
        if (!state.conversations.length) {
          return `<div class="page-view">
            ${pageHeader("HR / CONVERSATIONS", "候选人沟通", "查看指定候选人在对应岗位下的会话记录，并在工作台中完成沟通。")}
            ${emptyState("尚未发起沟通", "求职流程开始后，这里会出现可沟通的会话。")}
          </div>`;
        }
        const selected = state.conversations.find((item) => item.id === (state.selectedConversationId ?? state.conversations[0].id)) ?? state.conversations[0];
        scheduleProactiveQuery(selected);
        const list = state.conversations.map((conversation) =>
          `<button type="button" class="conversation-item ${conversation.id === selected.id ? "is-active" : ""}" data-action="select-conversation" data-id="${esc(conversation.id)}"><strong>${esc(conversation.candidateName)}</strong><span>${esc(conversation.jobTitle)}</span></button>`,
        ).join("");
        const messages = selected.messages.map((message) => {
          const attachments = message.attachments ?? [];
          const attachmentOnly = message.sender === "agent" && attachments.length > 0;
          if (attachmentOnly) {
            return `<div class="message-row is-agent is-attachment-only"><div class="message-attachment-stack">${attachments.map((attachment) => attachmentCard(message, attachment)).join("")}</div></div>`;
          }
          return `<div class="message-row ${message.sender === "hr" ? "is-hr" : "is-agent"}"><div class="message-bubble"><strong>${message.sender === "hr" ? "HR" : esc(selected.candidateName)}</strong>${message.text ? `<span>${esc(message.text)}</span>` : ""}<time>${fmtTime(message.createdAt)}</time></div></div>`;
        }).join("");
        return `<div class="page-view">
          ${pageHeader("HR / CONVERSATIONS", "候选人沟通", "查看指定候选人在对应岗位下的会话记录，并在工作台中完成沟通。")}
          ${state.error ? errorState(state.error) : ""}
          <section class="chat-layout">
            <aside class="conversation-list">
              <div class="panel-heading"><h2>会话</h2>${badge("info", state.conversations.length)}</div>
              ${list}
            </aside>
            <div class="conversation-main">
              <div class="conversation-header">
                <div><h2>${esc(selected.candidateName)}</h2><p>${esc(selected.jobTitle)}</p></div>
                ${badge("success", "可沟通")}
              </div>
              <div id="messageList" class="message-list">${messages}</div>
              <form id="composerForm" class="message-composer">
                <label class="visually-hidden" for="message-input">消息内容</label>
                <textarea id="message-input" rows="3" placeholder="输入要发送给求职 Agent 的消息" ${state.sendingMessage ? "disabled" : ""}>${esc(state.composerText)}</textarea>
                <button class="button button-primary" type="submit" ${state.sendingMessage || !state.composerText.trim() ? "disabled" : ""}>${state.sendingMessage ? "发送中…" : "发送消息"}</button>
              </form>
            </div>
          </section>
        </div>`;
      }

      function renderApplications() {
        const applications = state.hrApplications();
        if (!applications.length) {
          return `<div class="page-view">
            ${pageHeader("HR / APPLICATIONS", "管理投递进度", "按岗位查看投递记录，只推进当前候选人的单条投递状态。")}
            ${emptyState("暂无投递记录", "求职者启动 Agent 后，投递记录会在这里显示。")}
          </div>`;
        }
        const cards = applications.map((app) => {
          const meta = deliveryProgressMeta[app.status];
          const terminal = meta.terminal;
          const options = [`<option value="${app.status}" disabled selected>${esc(meta.label)}</option>`]
            .concat(getAllowedDeliveryTransitions(app.status).map((status) => `<option value="${status}">${esc(deliveryProgressMeta[status].label)}</option>`))
            .join("");
          return `<article class="application-card">
            <div class="application-top">
              <div><h2>${esc(app.jobTitle)}</h2><p>${esc(app.companyName ?? "未提供公司名称")} · ${esc(app.candidateName)} · 第 ${app.round} 轮</p></div>
              ${badge(meta.tone, meta.label)}
            </div>
            ${progressTimeline(app.status)}
            <div class="status-editor">
              <label for="status-${esc(app.id)}">更新当前阶段<select id="status-${esc(app.id)}" data-app-id="${esc(app.id)}" ${state.loading || terminal ? "disabled" : ""}>${options}</select></label>
              <button type="button" class="button button-ghost" data-action="app-terminate" data-id="${esc(app.id)}" ${state.loading || terminal ? "disabled" : ""}>标记流程终止</button>
            </div>
          </article>`;
        }).join("");
        return `<div class="page-view">
          ${pageHeader("HR / APPLICATIONS", "管理投递进度", "按岗位查看投递记录，只推进当前候选人的单条投递状态。")}
          ${state.error ? errorState(state.error) : ""}
          <section class="application-list">${cards}</section>
        </div>`;
      }

      // ---------- 布局外壳 ----------
      const candidateNav = [
        { route: "candidate/home", icon: "⌂", label: "使用指南" },
        { route: "candidate/documents", icon: "↥", label: "求职资料上传" },
        { route: "candidate/job-goal/create", icon: "◎", label: "求职任务" },
        { route: "candidate/progress", icon: "▥", label: "求职进度查看" },
      ];
      const hrNav = [
        { route: "hr/home", icon: "⌂", label: "使用指南" },
        { route: "hr/jobs", icon: "↥", label: "岗位 JD 上传" },
        { route: "hr/conversations", icon: "□", label: "求职沟通" },
        { route: "hr/applications", icon: "↗", label: "投递进度更新" },
      ];
      function activeNavRoute(route) {
        if (route.startsWith("candidate/job-goal")) return "candidate/job-goal/create";
        return route;
      }
      function renderShell(content) {
        const isCandidate = state.user.role === "candidate";
        const roleLabel = isCandidate ? "求职者工作台" : "HR 工作台";
        const nav = isCandidate ? candidateNav : hrNav;
        const active = activeNavRoute(state.route);
        return `<div class="app-shell">
          <aside class="sidebar" aria-label="主导航">
            <div class="brand-lockup"><div class="brand-mark">C</div><div><div class="sidebar-title">Careerpass</div></div></div>
            <div class="role-badge" aria-label="当前身份：${esc(roleLabel)}"><span class="dot" aria-hidden="true"></span><span>${esc(roleLabel)}</span></div>
            <nav class="sidebar-nav" aria-label="${esc(roleLabel)}导航">
              ${nav.map((item) => `<a href="#${item.route}" data-route="${item.route}" class="${active === item.route ? "active" : ""}"><span class="nav-icon">${item.icon}</span>${esc(item.label)}</a>`).join("")}
            </nav>
            <div class="sidebar-footer">
              <div class="profile-mini"><div class="avatar" aria-hidden="true">${esc(state.user.displayName.charAt(0))}</div><div><strong>${esc(state.user.displayName)}</strong><span>${esc(state.user.title)}</span></div></div>
              <button class="logout" type="button" data-action="logout">退出登录</button>
            </div>
          </aside>
          <main class="content-area"><div class="page-container">${state.initialized ? content : loadingState()}</div></main>
        </div>`;
      }

      function toastHtml() {
        if (!state.toast) return "";
        return `<div class="toast toast-${state.toast.tone}" role="${state.toast.tone === "error" ? "alert" : "status"}"><span>${esc(state.toast.message)}</span><button type="button" aria-label="关闭提示" data-action="close-toast">×</button></div>`;
      }

      function render() {
        const root = $("#root");
        const route = state.route;
        if (route === "login") { root.innerHTML = renderLogin() + toastHtml(); return; }
        if (route === "register") { root.innerHTML = renderRegister() + toastHtml(); return; }
        let content = "";
        if (!state.initialized) content = loadingState();
        else if (route === "candidate/home") content = renderCandidateHome();
        else if (route === "candidate/documents") content = renderDocuments();
        else if (route === "candidate/job-goal/create") content = renderJobGoalCreate();
        else if (route === "candidate/job-goal/view") content = renderJobGoalView();
        else if (route === "candidate/progress") content = renderProgress();
        else if (route === "hr/home") content = renderHrHome();
        else if (route === "hr/jobs") content = renderJobs();
        else if (route === "hr/conversations") content = renderConversations();
        else if (route === "hr/applications") content = renderApplications();
        else { state.route = "login"; state.loginRole = "candidate"; root.innerHTML = renderLogin() + toastHtml(); return; }
        root.innerHTML = renderShell(content) + toastHtml();
        const list = $("#messageList");
        if (list) list.scrollTop = list.scrollHeight;
      }

      // ---------- 业务动作（对齐 mockRepository / 真实 API 语义） ----------
      state.hrApplications = () => state.applications.map((app) => ({
        id: app.id, jobId: app.jobId, jobTitle: app.jobTitle, companyName: app.company, candidateName: userFixtures.candidate.displayName, status: app.status, round: app.round,
      }));
      state.downloadingAttachmentId = null;
      state.downloadedAttachmentIds = new Set();

      async function uploadResume(file) {

      async function deleteResume() {
        const current = state.resume;
        if (!current) return;
        if (!window.confirm(`确认删除当前简历“${current.fileName}”吗？`)) return;
        state.resumeLoading = true;
        render();
        await sleep(180);
        state.resume = null;
        state.resumeLoading = false;
        render();
        showToast("当前简历已删除。");
      }

      async function uploadDocuments(files) {
        state.supportingDocumentUploads = files.map((file) => ({ fileName: file.name || "supporting-document.pdf", status: "ready" }));
        state.supportingDocumentsLoading = true;
        state.error = null;
        render();
        await sleep(700);
        const results = files.map((file, index) => {
          const fileName = file.name || `supporting-document-${index + 1}.pdf`;
          const extension = fileName.split(".").at(-1)?.toLowerCase();
          const allowed = ["pdf", "md", "jpg", "png"].includes(extension);
          if (!allowed || file.size === 0) return { fileName, status: "failed" };
          if (file.size > 10_000_000) return { fileName, status: "failed" };
          const fingerprint = `${file.name}:${file.size}:${file.lastModified}`;
          const existingId = state.documentFingerprints.get(fingerprint);
          if (existingId && state.supportingDocuments.some((item) => item.id === existingId)) return { fileName, status: "success" };
          const document = {
            id: uid("document"),
            fileName,
            fileType: ["pdf", "md", "jpg", "png"].includes(extension) ? extension : "pdf",
            sizeBytes: file.size,
            uploadedAt: nowIso(),
            status: "success",
          };
          state.documentFingerprints.set(fingerprint, document.id);
          state.supportingDocuments = [...state.supportingDocuments, document];
          return { fileName, status: "success" };
        });
        state.supportingDocumentUploads = [];
        state.supportingDocumentsLoading = false;
        render();
        const failedUploads = results.filter((item) => item.status === "failed");
        if (failedUploads.length === 0) {
          showToast("其它资料已就绪。");
          return;
        }
        const failedFileNames = failedUploads.map((item) => item.fileName).join("、");
        showToast(
          failedUploads.length === 1
            ? `${failedFileNames} 上传失败：请检查文件格式或大小。`
            : `${failedUploads.length} 个文件上传失败：${failedFileNames}。请检查文件格式或大小。`,
          "error",
        );
      }

      async function deleteDocument(id, fileName) {
        if (!window.confirm(`确认删除资料“${fileName}”吗？`)) return;
        state.supportingDocuments = state.supportingDocuments.filter((item) => item.id !== id);
        render();
        await sleep(180);
        showToast("资料已删除。");

      async function uploadJobs(files) {

        // 演示数据一致性：任意一次上传都载入全部 20 份构造岗位 JD；已存在时不重复创建。
        if (state.hrJobs.length) { render(); return; }
        state.uploadingJobs = true;
        state.error = null;
        render();
        await sleep(500);
        const createdAt = nowIso();
        state.hrJobs = jobFixtures.map((fixture) => ({
          id: uid("job"),

        state.hrJobs.forEach((job, index) => {
          setTimeout(() => {
            if (job.parseStatus === "running") job.parseStatus = "succeeded";

      async function deleteJob(id) {
        state.hrJobs = state.hrJobs.filter((job) => job.id !== id);
        render();
      }

      async function saveGoal() {
        if (state.savingGoal) return;
        const form = state.goalForm;
        const offerTarget = Number(form.offerTarget);
        if (!Number.isInteger(offerTarget) || offerTarget < 1 || offerTarget > 10 || !form.title.trim()) {
          state.error = "请填写有效的目标 Offer 数量和岗位名称。";
          render();
          return;
        }
        state.savingGoal = true;
        state.error = null;
        render();
        await sleep(260);
        state.jobGoal = {
          id: state.jobGoal?.id ?? uid("goal"),
          offerTarget,
          title: form.title.trim(),
          filters: form.filters.trim(),
          status: state.jobGoal?.status ?? "active",
          createdAt: state.jobGoal?.createdAt ?? nowIso(),
          updatedAt: nowIso(),
        };
        if (state.resume?.parseStatus === "succeeded" && state.agentStatus === "not_started") {
          state.agentStatus = "ready";
        }
        state.agentRunCanStart = state.agentStatus === "ready";
        state.savingGoal = false;
        render();
        showToast("求职目标已保存。");
      }

      // 为一批岗位创建投递记录与对应会话容器，挂在指定轮次上。
      function createApplicationsForRound(jobs, round) {
        const created = jobs.map((job) => ({
          id: uid("application"),
          jobId: job.id,
          jobTitle: job.jobTitle,
          company: job.companyName,
          location: job.location,
          salary: job.salary,
          status: "submitted",
          appliedAt: nowIso(),
          lastContactAt: null,
          matchScore: job.matchScore,
          recommendationReason: job.recommendationReason,
          round,
        }));
        state.applications.push(...created);
        created.forEach((app) => {
          state.conversations.push({
            id: uid("conversation"),
            applicationId: app.id,
            jobTitle: app.jobTitle,
            candidateName: userFixtures.candidate.displayName,
            messages: [],
            queryAsked: false,
            queryPending: false,
          });
        });
      }

      // 轮次推进：Offer 未达标且当前轮没有进行中的岗位时开启下一轮。
      // 条件触发后立即弹窗提示（异步任务受理信号），延迟 4.5 秒后才刷新页面出现新一轮岗位
      // （模拟向量检索 + 关键词检索 + 重排 + LLM 解析评分的异步匹配耗时）。
      function evaluateRoundAdvance() {
        if (state.agentStatus !== "running" || state.roundAdvancing) return false;
        const currentRoundApps = state.applications.filter((item) => item.round === state.round);
        const noActiveInRound = currentRoundApps.length > 0 && currentRoundApps.every((item) => deliveryProgressMeta[item.status].terminal);
        const offerCount = getOfferCount(state.applications.map((item) => item.status));
        const belowTarget = !state.jobGoal || offerCount < state.jobGoal.offerTarget;
        if (!noActiveInRound || !belowTarget || !state.reserveJobs.length) return false;
        const nextRoundNo = state.round + 1;
        const nextBatch = state.reserveJobs.splice(0, roundCapFor(nextRoundNo));
        state.roundAdvancing = true;
        if (state.route !== "login" && state.route !== "register") {
          showToast(`检测到本轮投递已全部结束且 Offer 未达标，Agent 已自动开启第 ${nextRoundNo} 轮投递`, "info");
        }
        setTimeout(() => {
          state.round = nextRoundNo;
          createApplicationsForRound(nextBatch, nextRoundNo);
          state.roundAdvancing = false;
          if (state.route !== "login" && state.route !== "register") render();
        }, 4500);
        return true;
      }

      async function startAgent() {
        if (state.startingAgent || state.savingGoal) return;
        state.startingAgent = true;
        state.error = null;
        render();
        await sleep(520);
        if (!state.resume || state.resume.parseStatus !== "succeeded") {
          state.startingAgent = false;
          state.error = "简历解析成功后才能启动 Agent。";
          render();
          return;
        }
        if (!state.jobGoal) {
          state.startingAgent = false;
          state.error = "请先创建求职目标。";
          render();
          return;
        }
        if (state.agentStatus === "finished") {
          state.startingAgent = false;
          state.error = "Agent 已结束，不能重复启动。";
          render();
          return;
        }
        const parsedJobs = state.hrJobs.filter((job) => job.parseStatus === "succeeded");
        if (!parsedJobs.length) {
          state.startingAgent = false;
          state.error = "当前没有可用的岗位 JD，请先由 HR 上传并完成解析。";
          render();
          return;
        }
        // 模拟 S-08 同步匹配 + 多轮投递：全量筛选，按综合匹配得分投递 Top-K，其余进入储备。
        const ranked = parsedJobs.slice().sort((a, b) => b.matchScore - a.matchScore);
        const firstRound = ranked.slice(0, roundCapFor(1));
        state.reserveJobs = ranked.slice(roundCapFor(1));
        state.applications = [];
        state.conversations = [];
        createApplicationsForRound(firstRound, 1);
        state.hrJobs.forEach((job) => { job.matchStarted = true; });
        state.matchingSummary = { evaluatedJobCount: parsedJobs.length };
        state.agentStatus = "running";
        state.agentRun = { status: "running", finishReason: null };
        state.agentRunCanStart = false;
        state.round = 1;
        state.startingAgent = false;
        render();
      }

      async function updateApplicationStatus(id, status) {
        const application = state.applications.find((item) => item.id === id);
        if (!application) {
          state.error = "没有找到对应的投递记录。";
          render();
          return;
        }
        if (!isValidDeliveryTransition(application.status, status)) {
          state.error = "该投递状态不能直接跳转到目标阶段。";
          render();
          return;
        }
        state.loading = true;
        render();
        await sleep(280);
        application.status = status;
        application.lastContactAt = nowIso();
        const offerCount = getOfferCount(state.applications.map((item) => item.status));
        let roundAdvanced = false;
        if (state.jobGoal && offerCount >= state.jobGoal.offerTarget) {
          state.agentStatus = "finished";
          state.jobGoal.status = "achieved";
          state.agentRun = { status: "finished", finishReason: "offer_target_reached" };
        } else {
          roundAdvanced = evaluateRoundAdvance();
        }
        state.loading = false;
        render();
        if (!roundAdvanced) showToast("投递进度已更新。");
      }

      // ---------- 会话动作（S10-01/02/03 语义） ----------
      // 资料意图识别与检索（对齐后端 document_delivery_service.py 的受控语义）。
      const DOCUMENT_ALIASES = {
        certificate: ["证书", "资格证", "认证", "certificate", "certification"],
        photo: ["照片", "证件照", "photo", "picture"],
        academic_status: ["学籍证明", "学籍材料", "学籍验证报告", "学籍证明材料", "学籍验证报告材料"],
        proof: ["证明", "证明材料", "proof", "document"],
      };
      const REQUEST_MARKERS = [
        "请提供", "请发送", "能否提供", "可以提供", "请上传", "发一下", "发给我", "发来",
        "传一下", "传给我", "提供", "发送", "provide", "send", "share", "give me",
      ];
      const REQUESTED_NAME_PATTERNS = [
        /(?:把|将)\s*([^，。！？?!]+?)\s*(?:发一下|发给我|发来|发送|提供|传一下|传给我|发)/,
        /(?:请|麻烦|能否|可以)?\s*(?:提供|发送|发一下|发给我|发来|传一下|传给我)\s*([^，。！？?!]+)/,
      ];
      function normalizeDocumentText(value) {
        return String(value).toLowerCase()
          .replace(/\.[a-z0-9]{1,8}$/, "")
          .replace(/[_\-./\\]+/g, " ")
          .replace(/[^\w\u3400-\u9fff]+/g, " ")
          .trim()
          .replace(/\s+/g, " ");
      }
      function detectDocumentIntent(content) {
        const normalized = normalizeDocumentText(content);
        if (!REQUEST_MARKERS.some((marker) => normalized.includes(normalizeDocumentText(marker)))) return null;
        for (const [intent, aliases] of Object.entries(DOCUMENT_ALIASES)) {
          if (aliases.some((alias) => normalized.includes(normalizeDocumentText(alias)))) return intent;
        }
        for (const pattern of REQUESTED_NAME_PATTERNS) {
          const match = normalized.match(pattern);
          if (!match) continue;
          const target = match[1].replace(/^(你的|我的|候选人的|求职者的|相关的|这份|该份|一份)\s*/, "").trim();
          if (target) return target;
        }
        return null;
      }
      function resolveSupportingDocument(intentOrName) {
        const aliases = (DOCUMENT_ALIASES[intentOrName] ?? [intentOrName]).map(normalizeDocumentText);
        const matches = state.supportingDocuments.filter((doc) =>
          aliases.some((alias) => alias && normalizeDocumentText(doc.fileName).includes(alias)),
        );
        // 与正式版一致：仅唯一命中才交付，零命中或歧义都失败关闭。
        return matches.length === 1 ? matches[0] : null;
      }
      function scheduleProactiveQuery(conversation) {
        if (!conversation || conversation.queryAsked) return;
        conversation.queryAsked = true;
        // S10-03：HR 进入会话默认自动触发一次主动查询。
        setTimeout(() => {
          conversation.messages.push({
            id: uid("message"),
            sender: "agent",
            text: "想和您确认一个信息：这个岗位是否属于兼职性质？",
            createdAt: nowIso(),
          });
          conversation.queryPending = true;
          if (state.route === "hr/conversations") render();
        }, 1400);
      }

      function binaryAnswer(text) {
        if (/(不是|不属于|不对|非兼职|不兼职)/.test(text)) return "negative";
        if (/(是的|属于|对的|^是$|^对$|是的属于)/.test(text)) return "positive";
        return null;
      }

      async function sendMessage(content) {
        const selected = state.conversations.find((item) => item.id === (state.selectedConversationId ?? state.conversations[0]?.id));
        if (!selected || !content.trim()) return;
        state.sendingMessage = true;
        render();
        await sleep(500);
        selected.messages.push({ id: uid("message"), sender: "hr", text: content.trim(), createdAt: nowIso() });
        state.composerText = "";
        render();
        // 资料请求：提问后约 1.5 秒完成模糊识别与检索（对齐正式版异步节奏）。
        const documentIntent = detectDocumentIntent(content);
        if (documentIntent !== null) await sleep(1000);
        let agentMessage;
        if (selected.queryPending) {
          const answer = binaryAnswer(content.trim());
          // 查询问题是“岗位是否属于兼职性质”（求职过滤条件为不考虑兼职岗位）：
          // 肯定回答＝属于兼职，不满足过滤条件，不继续推进；否定回答＝不是兼职，条件满足，继续推进。
          if (answer === "positive") {
            agentMessage = { id: uid("message"), sender: "agent", text: "感谢沟通，当前不考虑这个岗位了。", createdAt: nowIso() };
            selected.queryPending = false;
          } else if (answer === "negative") {
            agentMessage = { id: uid("message"), sender: "agent", text: "好的，了解。", createdAt: nowIso() };
            selected.queryPending = false;
          }
        }
        if (!agentMessage && documentIntent !== null) {
          const document = resolveSupportingDocument(documentIntent);
          if (document) {
            // S10-02：唯一命中即以附件卡片交付，无额外成功提示语。
            agentMessage = {
              id: uid("message"),
              sender: "agent",
              text: "",
              createdAt: nowIso(),
              attachments: [{
                id: uid("attachment"),
                fileName: document.fileName,
                fileType: document.fileType,
                fileSizeBytes: document.sizeBytes ?? 0,
                createdAt: nowIso(),
                expiresAt: new Date(Date.now() + 7 * 24 * 3600 * 1000).toISOString(),
                status: "downloadable",
              }],
            };
          } else {
            agentMessage = { id: uid("message"), sender: "agent", text: "暂时没有找到符合条件的求职资料。", createdAt: nowIso() };
          }
        }
        if (!agentMessage) {
          agentMessage = { id: uid("message"), sender: "agent", text: "感谢您的沟通，我会补充说明候选人的相关项目经验。", createdAt: nowIso() };
        }
        selected.messages.push(agentMessage);
        state.sendingMessage = false;
        render();
      }

      async function downloadAttachment(messageId, attachmentId) {
        if (state.downloadingAttachmentId) return;
        state.downloadingAttachmentId = attachmentId;
        render();
        await sleep(700);
        state.downloadingAttachmentId = null;
        state.downloadedAttachmentIds.add(attachmentId);
        render();
      }

      // ---------- 事件绑定 ----------
      function navigate(route) {
        state.route = route;
        state.error = null;
        state.roundSelectOpen = false;
        if (route === "hr/conversations") state.selectedConversationId = state.selectedConversationId ?? null;
        render();
        window.scrollTo(0, 0);
      }

      document.addEventListener("click", (event) => {
        // 点击下拉控件外部时收起轮次选择菜单
        let closeRoundSelect = false;
        if (state.roundSelectOpen && !event.target.closest(".round-select")) {
          state.roundSelectOpen = false;
          closeRoundSelect = true;
        }
        const routeTarget = event.target.closest("[data-route]");
        const actionTarget = event.target.closest("[data-action]");
        if (actionTarget) {
          const action = actionTarget.dataset.action;
          if (action === "pick") {
            const input = document.getElementById(actionTarget.dataset.target);
            if (input && !input.disabled) input.click();
            return;
          }
          if (action === "login-role") {
            state.loginRole = actionTarget.dataset.role;
            state.loginError = null;
            render();
            return;
          }
          if (action === "logout") {
            state.route = "login";
            state.loginRole = "candidate";
            state.loginError = null;
            render();
            return;
          }
          if (action === "close-toast") { state.toast = null; render(); return; }
          if (action === "clear-error") { state.error = null; render(); return; }
          if (action === "select-conversation") { state.selectedConversationId = actionTarget.dataset.id; render(); return; }
          if (action === "toggle-round-select") { state.roundSelectOpen = !state.roundSelectOpen; render(); return; }
          if (action === "select-round") { state.selectedRound = Number(actionTarget.dataset.round); state.roundSelectOpen = false; render(); return; }
          if (action === "del-resume") { void deleteResume(); return; }
          if (action === "del-doc") {
            const doc = state.supportingDocuments.find((item) => item.id === actionTarget.dataset.id);
            if (doc) void deleteDocument(doc.id, doc.fileName);
            return;
          }
          if (action === "del-job") { void deleteJob(actionTarget.dataset.id); return; }
          if (action === "save-goal") { void saveGoal(); return; }
          if (action === "start-agent") { void startAgent(); return; }
          if (action === "app-terminate") { void updateApplicationStatus(actionTarget.dataset.id, "terminated"); return; }
          if (action === "download") { void downloadAttachment(actionTarget.dataset.mid, actionTarget.dataset.aid); return; }
        }
        if (routeTarget) {
          event.preventDefault();
          navigate(routeTarget.dataset.route);
        } else if (closeRoundSelect) {
          render();
        }
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        if (target.matches('input[type="file"][data-file]')) {
          const files = Array.from(target.files || []);
          target.value = "";
          if (!files.length) return;
          if (target.dataset.file === "resumeInput") void uploadResume(files[0]);
          if (target.dataset.file === "docsInput") void uploadDocuments(files);
          if (target.dataset.file === "jobsInput") void uploadJobs(files);
          return;
        }
        if (target.matches("select[data-app-id]")) {
          void updateApplicationStatus(target.dataset.appId, target.value);
        }
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        if (target.matches("[data-goal-field]")) {
          state.goalForm[target.dataset.goalField] = target.value;
          const saveButton = $("#save-job-goal");
          if (saveButton) {
            const locked = state.agentStatus === "running" || state.agentStatus === "finished";
            saveButton.disabled = state.savingGoal || locked || !state.goalForm.title.trim();
          }
          return;
        }
        if (target.matches("#message-input")) {
          state.composerText = target.value;
          const submit = $("#composerForm button[type='submit']");
          if (submit) submit.disabled = state.sendingMessage || !state.composerText.trim();
        }
      });

      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (form.id === "loginForm") {
          event.preventDefault();
          const username = form.querySelector('[name="username"]').value;
          const password = form.querySelector('[name="password"]').value;
          void doLogin(username, password);
          return;
        }
        if (form.id === "composerForm") {
          event.preventDefault();
          if (state.sendingMessage || !state.composerText.trim()) return;
          void sendMessage(state.composerText);
        }
      });

      render();
    </script>
  </body>
</html>
